worker_processes  1;
error_log stderr warn;
pid /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main_timed  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            '$request_time $upstream_response_time $pipe $upstream_cache_status';

    access_log /dev/stdout main_timed;
    error_log /dev/stderr notice;

    keepalive_timeout  65;

    # uploads (documents, scans, photos — the file store takes up to 25 MB): same ceiling as php.ini's upload_max_filesize /
    # post_max_size. Without it nginx stops at its 1 MB default with a 413 before PHP ever sees the file (found 2026-10-06).
    client_max_body_size 40m;

    server {
        listen [::]:80 default_server;
        listen 80 default_server;
        server_name ${NGINX_SERVERNAME};

        sendfile off;

        root /app/public_html;
        index index.php;

        location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to index.php
            try_files $uri $uri/ /index.php?q=$uri&$args;
        }

        # Rim Office (gera-archi-office), the office's interface: a static build in public_html/bureau/ (make bureau). `^~` so the
        # static-files regex below does not take its scripts; any other /bureau/... path is one of its pages -> its index.html.
        # Not cached: index.html must follow each deploy (its scripts are content-hashed anyway). docs/V2_ROLLOUT_PLAN.md B4.
        location = /bureau {
            absolute_redirect off; # a relative Location: behind the host's nginx, this container's own host/port mean nothing
            return 301 /bureau/;
        }
        location ^~ /bureau/ {
            add_header Cache-Control "no-cache";
            try_files $uri /bureau/index.html;
        }

        # redirect server error pages to the static page /50x.html
        #
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/lib/nginx/html;
        }

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_index index.php;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            include fastcgi_params;
        }

        location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml)$ {
            expires 5d;
        }
        
        location ~* \.(eot|otf|ttf|woff|woff2)$ {
            add_header Access-Control-Allow-Origin *;
        }

        # deny access to . files, for security
        #
        location ~ /\. {
            log_not_found off;
            deny all;
        }

        # allow fpm ping and status from localhost
        #
        location ~ ^/(fpm-status|fpm-ping)$ {
            access_log off;
            allow 127.0.0.1;
            deny all;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
